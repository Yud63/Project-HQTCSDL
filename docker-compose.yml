services:
  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: filmlab-web
    env_file:
      - backend/.env.docker
    environment:
      DB_SERVER: host.docker.internal
      DB_PORT: "14333"
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped